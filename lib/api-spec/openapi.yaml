openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: spotify
    description: Public Spotify now-playing data
  - name: steam
    description: Public Steam now-playing data
  - name: yandex
    description: Yandex Music track lookup
  - name: messages
    description: Anonymous messages
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /spotify/currently-playing:
    get:
      operationId: getCurrentSpotifyTrack
      tags: [spotify]
      summary: Get the public now-playing Spotify track
      description: Returns normalized playback metadata without exposing Spotify credentials.
      responses:
        "200":
          description: Current playback state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotifyCurrentlyPlaying"
  /steam/currently-playing:
    get:
      operationId: getCurrentSteamGame
      tags: [steam]
      summary: Get the public Steam currently playing game
      description: Returns the current game from the public Steam profile without exposing credentials.
      responses:
        "200":
          description: Current Steam game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SteamCurrentlyPlaying"
  /yandex/track:
    get:
      operationId: findYandexTrack
      tags: [yandex]
      summary: Find the current track in Yandex Music
      parameters:
        - name: title
          in: query
          required: true
          schema:
            type: string
        - name: artist
          in: query
          required: true
          schema:
            type: string
        - name: album
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Canonical Yandex Music track URL, or a Yandex Music search URL when the API lookup is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YandexTrackLink"
  /send:
    post:
      operationId: sendAnonymousMessage
      tags: [messages]
      summary: Send an anonymous message to the page owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: Message delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"
        "400":
          description: Invalid message
        "429":
          description: Rate limit exceeded
        "503":
          description: Telegram is not configured
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SpotifyTrack:
      type: object
      properties:
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        imageUrl:
          type: string
          format: uri
          nullable: true
        spotifyUrl:
          type: string
          format: uri
      required:
        - title
        - artist
        - album
        - imageUrl
        - spotifyUrl
    SpotifyCurrentlyPlaying:
      type: object
      properties:
        status:
          type: string
          enum:
            - playing
            - paused
            - idle
            - not_configured
            - not_connected
            - unavailable
        track:
          allOf:
            - $ref: "#/components/schemas/SpotifyTrack"
          nullable: true
        message:
          type: string
      required:
        - status
        - track
        - message
    SteamGame:
      type: object
      properties:
        name:
          type: string
        appId:
          type: string
          nullable: true
        steamUrl:
          type: string
          format: uri
        imageUrl:
          type: string
          format: uri
          nullable: true
      required:
        - name
        - appId
        - steamUrl
        - imageUrl
    SteamCurrentlyPlaying:
      type: object
      properties:
        status:
          type: string
          enum:
            - playing
            - not_playing
            - unavailable
        game:
          allOf:
            - $ref: "#/components/schemas/SteamGame"
          nullable: true
        message:
          type: string
      required:
        - status
        - game
        - message
    YandexTrackLink:
      type: object
      properties:
        url:
          type: string
          format: uri
      required:
        - url
    SendMessageRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - message
    SendMessageResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    ErrorMessage:
      type: object
      properties:
        message:
          type: string
      required:
        - message

