openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: spotify
    description: Public Spotify now-playing data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /spotify/currently-playing:
    get:
      operationId: getCurrentSpotifyTrack
      tags: [spotify]
      summary: Get the public now-playing Spotify track
      description: Returns normalized playback metadata without exposing Spotify credentials.
      responses:
        "200":
          description: Current playback state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotifyCurrentlyPlaying"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SpotifyTrack:
      type: object
      properties:
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        imageUrl:
          type: string
          format: uri
          nullable: true
        spotifyUrl:
          type: string
          format: uri
      required:
        - title
        - artist
        - album
        - imageUrl
        - spotifyUrl
    SpotifyCurrentlyPlaying:
      type: object
      properties:
        status:
          type: string
          enum:
            - playing
            - paused
            - idle
            - not_configured
            - not_connected
            - unavailable
        track:
          allOf:
            - $ref: "#/components/schemas/SpotifyTrack"
          nullable: true
        message:
          type: string
      required:
        - status
        - track
        - message

